name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_QR_SIGN_SECRET: ${{ secrets.VITE_QR_SIGN_SECRET }}

      # Nota: El despliegue a Vercel se hace automáticamente mediante la integración de GitHub
      # Configura la integración en: Vercel Dashboard → Settings → Git → Connect GitHub
      # Esto permite despliegues automáticos sin necesidad de secrets adicionales
